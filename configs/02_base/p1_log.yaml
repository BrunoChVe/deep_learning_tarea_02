# p1_log — Adapformer con top-k adaptativo (k = 4): el método completo del paper con la configuración inicial (k = 4, pérdida log, anclaje, γ = 0.8).
# Resultado medido: val MSE 0.01205 ± 0.00012 · NSE mediana 0.645 (3 semillas)
# Uso: python src/entrenar.py --config configs/02_base/p1_log.yaml --seed 42   # → outputs/p1_log_s42
nombre: p1_log
descripcion: 'Adapformer con top-k adaptativo (k = 4): el método completo del paper con la configuración inicial
  (k = 4, pérdida log, anclaje, γ = 0.8).'
semillas:
- 42
- 43
- 44
model:
  name: adapformer
  T: 336
  L: 48
  N: 12
  D: 256
  r: 32
  d: 64
  k: 4
  E: 2
  nhead: 8
  H: 512
  dropout: 0.1
  use_ace: true
  acf_mode: topk
  anchor_last: true
  basin_emb: false
  emb_mlp: false
train:
  loss: log
  lam_mmh: 20.0
  no_aux: false
  ema: 0.0
  epochs: 30
  lr: 0.001
  gamma: 0.8
  patience: 5
  batch: 512
