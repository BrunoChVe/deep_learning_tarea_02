# cd_r64 — k = 12 + rango de ACE más alto (r = 64, d = 128).
# Resultado medido: val MSE 0.01167 ± 0.00025 · NSE mediana 0.648 (3 semillas)
# Uso: python src/entrenar.py --config configs/04_mejoras_descartadas/cd_r64.yaml --seed 42   # → outputs/cd_r64_s42
nombre: cd_r64
descripcion: k = 12 + rango de ACE más alto (r = 64, d = 128).
semillas:
- 42
- 43
- 44
model:
  name: adapformer
  T: 336
  L: 48
  N: 12
  D: 256
  r: 64
  d: 128
  k: 12
  E: 2
  nhead: 8
  H: 512
  dropout: 0.1
  use_ace: true
  acf_mode: cd
  anchor_last: true
  basin_emb: false
  emb_mlp: false
train:
  loss: log
  lam_mmh: 20.0
  no_aux: false
  ema: 0.0
  epochs: 30
  lr: 0.001
  gamma: 0.8
  patience: 5
  batch: 512
