# cd_embmlp — k = 12 + embedding con rama no lineal residual (Linear→GELU→Linear).
# Resultado medido: val MSE 0.01195 ± 0.00012 · NSE mediana 0.617 (3 semillas)
# Uso: python src/entrenar.py --config configs/04_mejoras_descartadas/cd_embmlp.yaml --seed 42   # → outputs/cd_embmlp_s42
nombre: cd_embmlp
descripcion: k = 12 + embedding con rama no lineal residual (Linear→GELU→Linear).
semillas:
- 42
- 43
- 44
model:
  name: adapformer
  T: 336
  L: 48
  N: 12
  D: 256
  r: 32
  d: 64
  k: 12
  E: 2
  nhead: 8
  H: 512
  dropout: 0.1
  use_ace: true
  acf_mode: cd
  anchor_last: true
  basin_emb: false
  emb_mlp: true
train:
  loss: log
  lam_mmh: 20.0
  no_aux: false
  ema: 0.0
  epochs: 30
  lr: 0.001
  gamma: 0.8
  patience: 5
  batch: 512
