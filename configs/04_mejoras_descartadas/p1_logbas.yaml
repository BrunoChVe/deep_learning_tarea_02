# p1_logbas — Token de cuenca: embedding de basin_id como 13.º token.
# Resultado medido: val MSE 0.01233 ± 0.00012 · NSE mediana 0.626 (3 semillas)
# Uso: python src/entrenar.py --config configs/04_mejoras_descartadas/p1_logbas.yaml --seed 42   # → outputs/p1_logbas_s42
nombre: p1_logbas
descripcion: 'Token de cuenca: embedding de basin_id como 13.º token.'
semillas:
- 42
- 43
- 44
model:
  name: adapformer
  T: 336
  L: 48
  N: 12
  D: 256
  r: 32
  d: 64
  k: 4
  E: 2
  nhead: 8
  H: 512
  dropout: 0.1
  use_ace: true
  acf_mode: topk
  anchor_last: true
  basin_emb: true
  emb_mlp: false
train:
  loss: log
  lam_mmh: 20.0
  no_aux: false
  ema: 0.0
  epochs: 30
  lr: 0.001
  gamma: 0.8
  patience: 5
  batch: 512
