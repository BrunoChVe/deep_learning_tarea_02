# abl_ci — Ablación: k = 1 (channel-independent, sólo el caudal).
# Resultado medido: val MSE 0.01208 ± 0.00013 · NSE mediana 0.637 (3 semillas)
# Uso: python src/entrenar.py --config configs/03_ablacion/abl_ci.yaml --seed 42   # → outputs/abl_ci_s42
nombre: abl_ci
descripcion: 'Ablación: k = 1 (channel-independent, sólo el caudal).'
semillas:
- 42
- 43
- 44
model:
  name: adapformer
  T: 336
  L: 48
  N: 12
  D: 256
  r: 32
  d: 64
  k: 1
  E: 2
  nhead: 8
  H: 512
  dropout: 0.1
  use_ace: true
  acf_mode: ci
  anchor_last: true
  basin_emb: false
  emb_mlp: false
train:
  loss: log
  lam_mmh: 20.0
  no_aux: false
  ema: 0.0
  epochs: 30
  lr: 0.001
  gamma: 0.8
  patience: 5
  batch: 512
