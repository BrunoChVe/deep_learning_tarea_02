# af_log — Exploración (1 semilla): réplica de la versión inicial, pérdida log.
# Resultado medido: val MSE 0.01195 · NSE mediana 0.647 (1 semilla)
# Uso: python src/entrenar.py --config configs/05_exploracion/af_log.yaml --seed 42 --run af_log
nombre: af_log
descripcion: 'Exploración (1 semilla): réplica de la versión inicial, pérdida log.'
semillas:
- 42
model:
  name: adapformer
  T: 336
  L: 48
  N: 12
  D: 256
  r: 32
  d: 64
  k: 4
  E: 2
  nhead: 8
  H: 512
  dropout: 0.1
  use_ace: true
  acf_mode: topk
  anchor_last: true
  basin_emb: false
  emb_mlp: false
train:
  loss: log
  lam_mmh: 20.0
  no_aux: false
  ema: 0.0
  epochs: 30
  lr: 0.001
  gamma: 0.8
  patience: 5
  batch: 512
